name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: airman_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create test env
        run: |
          echo DATABASE_URL="postgresql://postgres:password@localhost:5432/airman_test_db" >> .env.test
          echo JWT_SECRET="testsecret" >> .env.test

      - name: Generate Prisma
        run: npx prisma generate

      - name: Push Schema
        run: npx prisma db push --force-reset

      - name: Run Tests
        run: npm test